    if (!sites.length) server = {state: 'idle', value: '未配置'};
    else {
      var down = filter(sites, function (p) { return p.ok === 0; }), flaky = filter(sites, function (p) { return p.ok > 0 && p.ok < p.attempts; });
      var slowest = 0;
      for (var i = 0; i < sites.length; i++) if (sites[i].ms !== null && sites[i].ms > slowest) slowest = sites[i].ms;
      server = down.length === sites.length ? {state: 'bad', value: '连不上'}
        : down.length ? {state: 'warn', value: (sites.length - down.length) + '/' + sites.length + ' 可用'} : flaky.length ? {state: 'warn', value: '不稳定'}
        : slowest > 1500 ? {state: 'warn', value: '偏慢 ' + slowest + 'ms'} : {state: 'ok', value: '正常 ' + slowest + 'ms'};
    }

    var core = filter(r.features.list, function (f) { return f.level === 'core' && f.ok === false; });
    var visual = filter(r.features.list, function (f) { return f.level === 'visual' && f.ok === false; });
    var major = (e.browser.version || '').split('.')[0];
    var browser = {state: core.length ? 'bad' : e.inApp || visual.length ? 'warn' : 'ok',
      value: core.length ? '版本太旧' : e.inApp ? e.inApp.name.replace('内置浏览器', '内置') : e.browser.name + (major ? ' ' + major : '')};

    var device = {state: 'ok', value: r.frames ? r.frames.fps + ' 帧' : '正常'};
    if (!r.storage.local) device = {state: 'bad', value: '存储被禁'};
    else if ((r.frames && r.frames.fps < 30) || r.cpuMs > 200) device.state = 'warn';

    return [
      {key: 'net', label: '网络', data: net},
      {key: 'server', label: '服务器', data: server},
      {key: 'browser', label: '浏览器', data: browser},
      {key: 'device', label: '设备', data: device}
    ];
  }

  /* ---------- 明细（弹层里） ---------- */

  function row(label, value, state) {
    var r = el('div', 'nd-row' + (state ? ' nd-' + state : ''));
    r.appendChild(el('span', 'nd-row-label', label));
    r.appendChild(el('span', 'nd-row-value', value));
    return r;
  }
  function group(title, open) {
    var d = el('details', 'nd-group');
    if (open) d.open = true;
    d.appendChild(el('summary', '', title));
    return d;
  }
  function probeState(p) { return p.ok === p.attempts ? (p.ms !== null && p.ms > 1500 ? 'warn' : 'ok') : p.ok ? 'warn' : 'bad'; }

  function details(r) {
    var root = el('div', 'nd-report'), e = r.env;

    for (var i = 0; i < r.verdict.length; i++) {
      var v = r.verdict[i], card = el('section', 'nd-card nd-' + v.level);
      card.appendChild(el('span', 'nd-mark', ICON[v.level]));
      var copy = el('div', 'nd-card-copy');
      copy.appendChild(el('b', '', v.title));
      if (v.advice) copy.appendChild(el('p', '', v.advice));
      card.appendChild(copy);
      root.appendChild(card);
    }

    var net = group('网络连接', true);
    for (var j = 0; j < r.probes.length; j++) {
      var p = r.probes[j];
      net.appendChild(row((p.group === 'site' ? '' : p.group === 'cn' ? '国内 · ' : '国际 · ') + p.name,
        p.ok ? p.ok + '/' + p.attempts + ' · ' + p.ms + 'ms' : '连不上', probeState(p)));
    }
    if (e.connection) net.appendChild(row('浏览器估计', [e.connection.effectiveType, e.connection.rtt !== null ? 'RTT ' + e.connection.rtt + 'ms' : '', e.connection.downlink !== null ? e.connection.downlink + 'Mbps' : ''].join(' ')));
    root.appendChild(net);

    var env = group('设备与浏览器');
    env.appendChild(row('系统', e.os));
    env.appendChild(row('浏览器', e.browser.name + ' ' + e.browser.version));
    env.appendChild(row('内核', e.engine));
    if (e.inApp) env.appendChild(row('所在 App', e.inApp.name, 'warn'));
    env.appendChild(row('屏幕', e.screen));
    env.appendChild(row('HTTPS', e.secure ? '是' : '否', e.secure ? 'ok' : 'warn'));
    root.appendChild(env);

    var feat = group('浏览器能力');
    for (var k = 0; k < r.features.list.length; k++) {
      var f = r.features.list[k];
      feat.appendChild(row(f.name, f.ok === null ? '未检测' : f.ok ? '支持' : '不支持' + (f.note ? '（' + f.note + '）' : ''),
        f.ok === null ? '' : f.ok ? 'ok' : f.level === 'core' ? 'bad' : 'warn'));
    }
    root.appendChild(feat);

    var perf = group('存储与流畅度');
    perf.appendChild(row('本地存储', r.storage.local ? '可用 · 约 ' + r.storage.usedKB + 'KB' : '不可用', r.storage.local ? 'ok' : 'bad'));
    perf.appendChild(row('画面帧率', r.frames ? r.frames.fps + ' fps' : '未测', r.frames ? (r.frames.fps < 30 ? 'warn' : 'ok') : ''));
    perf.appendChild(row('运算基准', r.cpuMs + 'ms', r.cpuMs > 200 ? 'warn' : 'ok'));
    if (r.timing) perf.appendChild(row('页面加载', '首字节 ' + r.timing.ttfb + 'ms · 就绪 ' + r.timing.domReady + 'ms'));
    root.appendChild(perf);

    for (var s = 0; s < (r.sections || []).length; s++) {
      var sec = group(r.sections[s].title), lines = r.sections[s].lines;
      for (var l = 0; l < lines.length; l++) sec.appendChild(el('p', 'nd-line', lines[l]));
      root.appendChild(sec);
    }
    return root;
  }

  /* ---------- 自己输入网址检测 ---------- */

  function customBox(results) {
    var form = el('form', 'nd-custom'), field = el('div', 'nd-custom-field');
    var input = el('input', 'nd-input'), go = el('button', 'nd-go', '检测'), out = el('p', 'nd-custom-result nd-idle', '输入任意网址，单独测它能不能连上');
    input.type = 'text';
    input.setAttribute('inputmode', 'url');
    input.setAttribute('autocomplete', 'off');
    input.setAttribute('autocapitalize', 'off');
    input.setAttribute('spellcheck', 'false');
    input.placeholder = '例如 sidebyside.nya.pub';
    go.type = 'submit';
    field.appendChild(input);
    field.appendChild(go);
    form.appendChild(field);
    form.appendChild(out);
    var busy = false;
    form.onsubmit = function (ev) {
      if (ev && ev.preventDefault) ev.preventDefault();
      if (busy) return false;
      var task = NetDiagnose.checkUrl(input.value);
      if (!task) {
        out.className = 'nd-custom-result nd-bad';
        setText(out, '网址格式不对，试试 example.com 这样的写法');
        return false;
      }
      busy = true;
      go.disabled = true;
      out.className = 'nd-custom-result nd-run';
      setText(out, '正在检测 ' + input.value.replace(/^\s+|\s+$/g, '') + '…');
      if (input.blur) input.blur();
      task.then(function (p) {
        busy = false;
        go.disabled = false;
        results.push(p);
        var reasons = filter(p.results, function (x) { return !x.ok; }).map(function (x) { return x.detail; });
        var state = p.ok === p.attempts ? (p.ms > 1500 ? 'warn' : 'ok') : p.ok ? 'warn' : 'bad';
        out.className = 'nd-custom-result nd-' + state;
        setText(out, ICON[state] + ' ' + p.name + '：' + (p.ok === 0 ? '连不上（' + reasons[0] + '）'
          : (p.ok < p.attempts ? '不稳定 ' : p.ms > 1500 ? '偏慢 ' : '能连上 ') + p.ok + '/' + p.attempts + ' · ' + p.ms + 'ms'));
      });
      return false;
    };
    return form;
  }

  /* ---------- 底部弹层 ---------- */

  function makeSheet(app, title) {
    var sheet = el('div', 'nd-sheet'), panel = el('div', 'nd-sheet-panel'), head = el('header', 'nd-sheet-head'), close = el('button', 'nd-sheet-close', '收起');
    var body = el('div', 'nd-sheet-body');
    close.type = 'button';
    head.appendChild(el('b', '', title));
    head.appendChild(close);
    panel.appendChild(head);
    panel.appendChild(body);
    sheet.appendChild(panel);
    sheet.style.display = 'none';
    app.appendChild(sheet);
    function hide() { sheet.style.display = 'none'; }
    close.onclick = hide;
    sheet.onclick = function (ev) { if (ev.target === sheet) hide(); };
    return {
      hide: hide,
      show: function (content) { body.innerHTML = ''; body.appendChild(content); body.scrollTop = 0; sheet.style.display = ''; }
    };
  }

  /* ---------- 能打开的线路 ---------- */

  /** 能连上的站点：全部成功的排前面，同档按速度排。 */
  function usableSites(r) {
    return filter(r.probes, function (p) { return p.group === 'site' && p.open && p.ok > 0; }).sort(function (a, b) {
      var sa = a.ok === a.attempts ? 0 : 1, sb = b.ok === b.attempts ? 0 : 1;
      return sa - sb || a.ms - b.ms;
    });
  }

  function launchList(sites) {
    var box = el('div', 'nd-launch-list');
    box.appendChild(el('p', 'nd-launch-tip', '下面这些线路现在能连上，点一条就会打开网站：'));
    for (var i = 0; i < sites.length; i++) {
      var p = sites[i], stable = p.ok === p.attempts;
      var a = el('a', 'nd-link' + (i === 0 ? ' nd-best' : ''));
      a.href = p.open;
      var copy = el('span', 'nd-link-copy'), name = el('b', '', p.name);
      if (i === 0 && stable) name.appendChild(el('em', 'nd-tag', '最快'));
      if (!stable) name.appendChild(el('em', 'nd-tag nd-tag-warn', '不稳定'));
      copy.appendChild(name);
      copy.appendChild(el('small', '', NetDiagnose.hostOf(p.open)));
      a.appendChild(copy);
      a.appendChild(el('span', 'nd-link-ms', p.ms + 'ms'));
      a.appendChild(el('span', 'nd-link-go', '›'));
      box.appendChild(a);
    }
    box.appendChild(el('p', 'nd-launch-tip', '点开还是进不去的话，回到这里换一条，或者复制检测报告发给我们。'));
    return box;
  }

  /* ---------- 仪表盘 ---------- */

  /**
   * opts.run(onStep) → Promise<report>
   * opts.title：顶部小标题；opts.top=false 时不画顶栏（嵌在已有弹窗里）
   * opts.notify(text)：复制后的提示，默认改按钮文字
   * opts.custom：显示“自己输入网址检测”的输入框
   * opts.credit：底部的一行署名
   * opts.launch：检测完自动弹出能连上的线路，让对方自己选一条打开
   */
  function mount(root, opts) {
    var app = el('div', 'nd-app'), running = false, report = null;

    if (opts.top !== false) {
      var top = el('header', 'nd-top');
      top.appendChild(el('span', 'nd-brand', opts.title || '连接自检'));
      var time = el('span', 'nd-time', '');
      top.appendChild(time);
      app.appendChild(top);
    }

    var customs = [];
    if (opts.custom) app.appendChild(customBox(customs));

    var hero = el('section', 'nd-hero'), ring = el('div', 'nd-ring'), icon = el('span', 'nd-ring-icon', '');
    ring.appendChild(icon);
    var headline = el('h1', 'nd-headline', '正在检测…'), sub = el('p', 'nd-sub', '大约需要 10 秒');
    var more = el('button', 'nd-more', '查看详情');
    more.type = 'button';
    hero.appendChild(ring);
    hero.appendChild(headline);
    hero.appendChild(sub);
    var chips = el('div', 'nd-chips'), launch = el('button', 'nd-more nd-launch', '打开网站');
    launch.type = 'button';
    launch.style.display = 'none';
    chips.appendChild(launch);
    chips.appendChild(more);
    hero.appendChild(chips);
    app.appendChild(hero);

    var tiles = el('section', 'nd-tiles'), tileEls = [];
    var labels = ['网络', '服务器', '浏览器', '设备'];
    for (var i = 0; i < labels.length; i++) {
      var t = el('button', 'nd-tile nd-idle');
      t.type = 'button';
      var head = el('span', 'nd-tile-head');
      head.appendChild(el('span', 'nd-dot'));
      head.appendChild(el('small', '', labels[i]));
      t.appendChild(head);
      t.appendChild(el('b', '', '…'));
      t.onclick = openSheet;
      tiles.appendChild(t);
      tileEls.push(t);
    }
    app.appendChild(tiles);

    var bar = el('footer', 'nd-bar'), copy = el('button', 'nd-btn nd-primary', '复制检测报告'), again = el('button', 'nd-btn nd-ghost', '重新检测');
    copy.type = again.type = 'button';
    bar.appendChild(copy);
    bar.appendChild(again);
    app.appendChild(bar);
    if (opts.credit) app.appendChild(el('p', 'nd-credit', opts.credit));

    var detailSheet = makeSheet(app, '详细结果'), launchSheet = makeSheet(app, '选一条线路打开');
    var sites = [];

    function openSheet() {
      if (!report) return;
      launchSheet.hide();
      detailSheet.show(details(report));
    }
    function openLaunch() {
      if (!sites.length) return;
      detailSheet.hide();
      launchSheet.show(launchList(sites));
    }
    function closeSheet() { detailSheet.hide(); launchSheet.hide(); }
    more.onclick = openSheet;
    launch.onclick = openLaunch;

    function setState(state) {
      ring.className = 'nd-ring nd-' + state;
      setText(icon, ICON[state] || '');
    }

    function start() {
      if (running) return;
      running = true;
      report = null;
      closeSheet();
      setState('run');
      setText(headline, '正在检测…');
      setText(sub, '大约需要 10 秒');
      more.style.visibility = 'hidden';
      launch.style.display = 'none';
      sites = [];
      copy.disabled = again.disabled = true;
      for (var i = 0; i < tileEls.length; i++) {
        tileEls[i].className = 'nd-tile nd-idle';
        setText(tileEls[i].lastChild, '…');
      }
      opts.run(function (text) { setText(sub, text); }).then(function (r) {
        report = r;
        running = false;
        var main = r.verdict[0], summary = summarize(r), rest = filter(r.verdict, function (v) { return v.level === 'bad' || v.level === 'warn'; }).length;
        var states = [];
        for (var i = 0; i < summary.length; i++) {
          tileEls[i].className = 'nd-tile nd-' + summary[i].data.state;
          setText(tileEls[i].lastChild, summary[i].data.value);
          states.push(summary[i].data.state);
        }
        setState(main.level === 'info' ? worst(states) : main.level);
        setText(headline, main.title);
        setText(sub, main.advice);
        setText(more, rest > 1 ? '还有 ' + (rest - 1) + ' 条提示 · 查看详情' : '查看详细结果');
        more.style.visibility = '';
        if (time) setText(time, r.time.slice(5, 16));
        copy.disabled = again.disabled = false;
        if (opts.launch) {
          sites = usableSites(r);
          if (sites.length) {
            setText(launch, '打开网站 · ' + sites.length + ' 条可用');
            launch.style.display = '';
            openLaunch();
          }
        }
      }, function (err) {
        running = false;
        setState('bad');
        setText(headline, '检测中途出错了');
        setText(sub, (err && err.message ? err.message : String(err)) + '。请截图这个页面发给我们。');
        copy.disabled = again.disabled = false;
      });
    }

    copy.onclick = function () {
      var text = report ? report.text : '检测未完成\nUA：' + navigator.userAgent;
      if (customs.length) text += '\n\n—— 自己输入的网址 ——\n' + customs.map(NetDiagnose.formatProbe).join('\n');
      NetDiagnose.copyText(text).then(function (ok) {
        var msg = ok ? '已复制，去粘贴给我们吧' : '复制失败，请截图发给我们';
        if (opts.notify) return opts.notify(msg);
        setText(copy, msg);
        setTimeout(function () { setText(copy, '复制检测报告'); }, 2500);
      });
    };
    again.onclick = start;

    root.appendChild(app);
    return {start: start};
  }

  return {mount: mount, el: el};
})();

/* 独立检测页：不依赖主界面，主界面打不开时也能单独打开。 */
(function () {
  'use strict';
  window.__ndStarted = true;

  // 恋爱观察室 · 连接自检
  // 作者：小狗咖啡猫。使用 MIT 许可证（附加条款），详见 LICENSE：
  // 转载或 fork 时，必须保留署名“小狗咖啡猫”和网站名“恋爱观察室”，并把下面的线路换成你自己的。
  var SITE_NAME = '恋爱观察室', AUTHOR = '小狗咖啡猫';

  // 在这里填上主界面用到的域名，检测页会重点测它们，比如：
  //   {name: '主站', url: 'https://example.com/favicon.ico', open: 'https://example.com/'}
  // 也可以临时在链接后面加 ?target=网址（可以写多个）。
  // 都没填时，默认检测这个页面自己所在的站点。
  var SITE_TARGETS = [
    {name: 'workers.dev', url: 'https://sidebyside.sidebyside-proxy.workers.dev/favicon.ico', open: 'https://sidebyside.sidebyside-proxy.workers.dev/'},
    {name: 'nya.pub', url: 'https://sidebyside.nya.pub/favicon.ico', open: 'https://sidebyside.nya.pub/'},
    {name: '8bit.ca', url: 'https://sidebyside.8bit.ca/favicon.ico', open: 'https://sidebyside.8bit.ca/'},
    {name: 'mooo.com', url: 'https://sidebyside.mooo.com/favicon.ico', open: 'https://sidebyside.mooo.com/'}
  ];

  function targets() {
    var list = SITE_TARGETS.slice(), q = location.search.replace(/^\?/, '').split('&');
    for (var i = 0; i < q.length; i++) {
      var kv = q[i].split('=');
      if (kv[0] !== 'target' || !kv[1]) continue;
      var url = decodeURIComponent(kv[1].replace(/\+/g, ' '));
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      list.push({name: NetDiagnose.hostOf(url) || url, url: url});
    }
    if (!list.length && /^https?:$/.test(location.protocol)) {
      list.push({name: '本站 ' + location.host, url: NetDiagnose.originOf(location.href) + '/favicon.ico'});
    }
    return list;
  }

  var root = document.getElementById('nd-root');
  root.innerHTML = '';
  NetDiagnoseView.mount(root, {
    title: SITE_NAME + ' · 连接自检',
    credit: '© 2026 ' + AUTHOR + ' · ' + SITE_NAME + ' · MIT License',
    custom: true,
    launch: true,
    run: function (onStep) { return NetDiagnose.run({targets: targets(), siteName: SITE_NAME}, onStep); }
  }).start();
})();

}
</script>
